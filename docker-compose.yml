services:
  ctrs-service:
    build: ./service
    ports:
      - "8080:8080"
    environment:
      - MASTER_KEY=ctrs-demo-master-key-32bytes!!!!
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ctrs-data:/app/data
    working_dir: /app

  ctrs-dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - ctrs-service
    environment:
      - VITE_API_PROXY=http://ctrs-service:8080

volumes:
  ctrs-data:
